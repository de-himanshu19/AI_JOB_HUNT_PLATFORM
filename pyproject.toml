[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-hunt-platform"
version = "0.1.0"
description = "Local, source-independent job hunting platform core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.12.5",
]

[project.optional-dependencies]
test = [
    "pytest==9.0.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

