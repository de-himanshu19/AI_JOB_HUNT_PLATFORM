[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-hunt-platform"
version = "0.1.0"
description = "Local, source-independent job hunting platform core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4==4.13.5",
    "pydantic==2.12.5",
    "requests==2.32.5",
]

[project.scripts]
job-hunt = "app.cli:main"
job-hunt-dashboard = "app.dashboard.launcher:main"

[project.optional-dependencies]
dashboard = [
    "streamlit==1.58.0",
]
test = [
    "pytest==9.0.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "live: explicit opt-in test that may call a live external API",
]
